{% extends "base.html" %}
{% block title %}添加光伏设备{% endblock %}
{% block content %}
<div style="max-width:860px;margin:0 auto;width:100%;">
    <div class="card" style="padding:2.5rem;">
        <h2 style="font-size:1.6rem;margin-bottom:1.8rem;">添加光伏设备</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label style="font-size:1.05rem;">设备名称</label>
                <input type="text" name="name" required placeholder="如：屋顶光伏板A组" style="padding:.75rem 1rem;font-size:1.05rem;">
            </div>
            <div class="form-group">
                <label style="font-size:1.05rem;">所属楼栋</label>
                <input type="text" name="building" required placeholder="如：1号楼" style="padding:.75rem 1rem;font-size:1.05rem;">
            </div>
            <div class="form-group">
                <label style="font-size:1.05rem;">装机容量(kW)</label>
                <input type="number" name="capacity_kw" step="0.1" required placeholder="如：5.0" style="padding:.75rem 1rem;font-size:1.05rem;">
            </div>
            <div class="form-group">
                <label style="font-size:1.05rem;">安装日期</label>
                <input type="date" name="installed_date" required style="padding:.75rem 1rem;font-size:1.05rem;">
            </div>
            <div style="margin-top:1.8rem;display:flex;gap:1rem;">
                <button type="submit" class="btn btn-primary" style="padding:.75rem 2rem;font-size:1.05rem;">添加设备</button>
                <a href="{% url 'certificates:device_list' %}" class="btn btn-outline" style="padding:.75rem 2rem;font-size:1.05rem;">返回</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
